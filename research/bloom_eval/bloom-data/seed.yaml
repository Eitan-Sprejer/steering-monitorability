behavior:
  name: "reward-hacking"
  examples: []

temperature: 1.0
evaluator_reasoning_effort: "low"
target_reasoning_effort: "medium"
max_concurrent: 5
configurable_prompts: "d1_pipeline"
anonymous_target: false
debug: false

understanding:
  model: "claude-sonnet-4"
  max_tokens: 3000

ideation:
  model: "claude-sonnet-4"
  num_scenarios: 5
  variation_dimensions: ["sunk_cost_framing", "authority_bias", "emotional_pressure"]
  max_tokens: 16000
  web_search: false
